# Site configuration
base_url = "https://mylearnbase.com"
title = "My Learn Base"
description = "A personal learning journal and portfolio"
default_language = "en"
theme = "serene"
compile_sass = true
minify_html = true
build_search_index = false
generate_feeds = true
feed_filenames = ["rss.xml"]
taxonomies = [{ name = "tags" }, { name = "series" }]

[markdown]
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[link_checker]
# GitHub renders #L<N> line anchors via JavaScript; the static HTML only carries
# id="LC<N>" markers. Zola's link checker can't see the JS-handled anchor and
# false-positives on every cite-block URL. Page existence is still verified.
skip_anchor_prefixes = ["https://github.com/"]

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "catppuccin-mocha"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
# Authorship — used in JSON-LD structured data (templates/_head_extend.html)
author = "Efe Erhie"
author_url = "https://www.linkedin.com/in/efe-erhie"

# Search-engine ownership verification — paste the token from each console (Phase 4).
# Left empty = tag not emitted (empty string is falsy in Tera).
google_site_verification = "lVCWcpiroGyahah4QBMEOkCFFj9TFedrUItIU87WYN8"
bing_site_verification = ""

# Header nav (templates/_base.html) — slim, kept to active/populated surfaces.
# Empty forms (concepts/opinions/resources) are intentionally left off the
# follow-you-everywhere header; they stay linked on the homepage guide cards.
nav = [
  { name = "Posts", path = "/posts" },
  { name = "Logbook", path = "/posts/logbook" },
  { name = "Tags", path = "/tags" },
]
blog_section_path = "/posts"

# Résumé contact row + Person JSON-LD `sameAs` (templates/resume.html).
#
# Deliberately NO phone number and NO postal address: the source CV carries both,
# and neither belongs on a page that is public and search-indexed.
#
# NO personal email either, for now. A mailto: on an indexed page is harvested,
# and a personal address once scraped cannot be withdrawn. LinkedIn carries the
# contact path in the meantime. The intended fix is a forwarding alias on the
# efeerhie.com domain (Cloudflare Email Routing, free) — an address that can be
# rotated or switched off without touching the personal inbox. Add it here once
# it exists.
resume_links = [
  { name = "LinkedIn", url = "https://www.linkedin.com/in/efe-erhie", external = true },
  { name = "GitHub", url = "https://github.com/RustWright", external = true },
]

# The site's REAL address, deliberately a copy of base_url above.
#
# scripts/build-resume-pdf.sh must override base_url with a localhost address,
# or the printed page pulls its CSS from production instead of from disk. But
# that same override leaks into anything that reads base_url, and the first
# structured résumé shipped "127.0.0.1:1187" as the printed site address with
# six clickable links in the PDF pointing at localhost. Anything that must name
# the real site on paper reads this key instead, which no build flag touches.
# templates/resume.html fails the build if the two ever disagree.
canonical_url = "https://mylearnbase.com"

back_link_text = "Back"
force_theme = false

footer_copyright = "© 2026"
footer_credits = false

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

reaction = false
