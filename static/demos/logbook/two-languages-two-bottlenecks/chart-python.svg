<text class="endlab lbl-py" x="412.9" y="32.1">NumPy all-pairs</text>
<path d="M56.0 221.4 L150.0 187.6 L221.1 161.4 L292.2 135.5 L363.3 106.8 L404.9 88.8 L434.4 75.5 L476.0 55.3" class="pyl" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
