<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="Log-log chart of milliseconds per step versus number of boids, Python only. The pure-Python scalar loop is highest, NumPy all-pairs runs about three times below it, and the NumPy grid crosses all-pairs near five hundred boids." style="max-width:100%;height:auto">
<style>
.bg{fill:#ffffff}
.grid{stroke:#eeeae2;stroke-width:1}.axtx{fill:#7d776c;font:12px ui-monospace,Menlo,monospace}
.axlab{fill:#4a463f;font:600 12.5px ui-sans-serif,system-ui,sans-serif}
.note{fill:#7d776c;font:11px ui-sans-serif,system-ui,sans-serif}
.pyd{stroke:#8a2e08}.py{stroke:#c1440e}.pyl{stroke:#e27b3a}
.rsd{stroke:#004e7a}.rs{stroke:#0072b2}.rsl{stroke:#3da0da}
.lbl-pyd{fill:#8a2e08}.lbl-py{fill:#c1440e}.lbl-pyl{fill:#e27b3a}
.lbl-rsd{fill:#004e7a}.lbl-rs{fill:#0072b2}.lbl-rsl{fill:#3da0da}
.endlab{font:600 12px ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){
 .bg{fill:#1b1f26}
 .grid{stroke:#262b33}.axtx{fill:#8d8880}.axlab{fill:#c3bfb6}.note{fill:#8d8880}
 .pyd{stroke:#d95a2e}.py{stroke:#f0764a}.pyl{stroke:#f8a278}
 .rsd{stroke:#2e86c4}.rs{stroke:#4aa5dc}.rsl{stroke:#86c8f0}
 .lbl-pyd{fill:#d95a2e}.lbl-py{fill:#f0764a}.lbl-pyl{fill:#f8a278}
 .lbl-rsd{fill:#2e86c4}.lbl-rs{fill:#4aa5dc}.lbl-rsl{fill:#86c8f0}
}
</style>
<rect class="bg" x="0" y="0" width="720" height="460" rx="10"/>
<line class="grid" x1="56" y1="371.5" x2="570" y2="371.5"/>
<text class="axtx" x="47" y="375.5" text-anchor="end">0.1</text>
<line class="grid" x1="56" y1="290.2" x2="570" y2="290.2"/>
<text class="axtx" x="47" y="294.2" text-anchor="end">1</text>
<line class="grid" x1="56" y1="209.0" x2="570" y2="209.0"/>
<text class="axtx" x="47" y="213.0" text-anchor="end">10</text>
<line class="grid" x1="56" y1="127.7" x2="570" y2="127.7"/>
<text class="axtx" x="47" y="131.7" text-anchor="end">100</text>
<line class="grid" x1="56" y1="46.5" x2="570" y2="46.5"/>
<text class="axtx" x="47" y="50.5" text-anchor="end">1k</text>
<line class="grid" x1="56.0" y1="22" x2="56.0" y2="414"/>
<text class="axtx" x="56.0" y="434" text-anchor="middle">100</text>
<line class="grid" x1="292.2" y1="22" x2="292.2" y2="414"/>
<text class="axtx" x="292.2" y="434" text-anchor="middle">1k</text>
<line class="grid" x1="528.4" y1="22" x2="528.4" y2="414"/>
<text class="axtx" x="528.4" y="434" text-anchor="middle">10k</text>
<text class="axlab" x="313" y="452" text-anchor="middle">number of boids (N)</text>
<text class="axlab" transform="translate(15,218) rotate(-90)" text-anchor="middle">ms / step</text>
<path d="M56.0 229.2 L150.0 171.4 L221.1 126.4 L292.2 78.9" class="pyd" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 5"/>
<circle cx="56.0" cy="229.2" r="3" class="pyd" fill="none" stroke-width="1.6"/>
