<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 430" role="img" aria-label="A canvas divided into a grid of cells. One highlighted boid searches only its own cell and the eight around it, a three by three block. Boids outside that block are faded to show they are never checked. The boid's sensing radius fits inside one cell." style="max-width:100%;height:auto">
