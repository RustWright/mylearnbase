.block{fill:#2563eb;fill-opacity:.12;stroke:#2563eb;stroke-opacity:.5;stroke-width:1.5}
.radius{fill:none;stroke:#2563eb;stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
.bin{fill:#1e293b}.bout{fill:none;stroke:#94a3b8;stroke-width:1.2;opacity:.7}
.bfoc{fill:#2563eb}.fring{fill:none;stroke:#2563eb;stroke-width:1.5;opacity:.5}
.glab{fill:#2563eb;font:600 12px ui-sans-serif,system-ui,sans-serif}
.leg{fill:#1e293b;font:12px ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){
 .bg{fill:#0f172a}.cell{fill:#141c2b;stroke:#26324a}
 .block{fill:#60a5fa;stroke:#60a5fa}.radius{stroke:#60a5fa}
 .bin{fill:#e2e8f0}.bout{stroke:#5b6675}.bfoc{fill:#60a5fa}.fring{stroke:#60a5fa}
 .glab{fill:#60a5fa}.leg{fill:#e2e8f0}}
</style>
