<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" role="img" aria-label="The same four-wide SIMD load reads four adjacent memory slots. In an array of structs it lands on one boid's x, y, vx and vy, so a position pass gets only one useful x per load. In a structure of arrays every x is contiguous, so one load feeds four boids at once." style="max-width:100%;height:auto">
<style>
.bg{fill:#f8fafc}
.lab{fill:#1e293b;font:700 15px ui-sans-serif,system-ui,sans-serif}
.glab{fill:#64748b;font:12px ui-sans-serif,system-ui,sans-serif}
.cell{fill:#eef2f6;stroke:#cbd5e1;stroke-width:1.5}.xcell{fill:#2563eb;stroke:#2563eb;stroke-width:1.5}
.ctext{fill:#64748b;font:13px ui-monospace,Menlo,monospace}.xtext{fill:#fff;font:600 13px ui-monospace,Menlo,monospace}
.win{fill:none;stroke:#1e293b;stroke-width:3;stroke-dasharray:7 5}
.anno{fill:#1e293b;font:13px ui-sans-serif,system-ui,sans-serif}
.good{fill:#15803d;font-weight:700}.bad{fill:#b91c1c;font-weight:700}
.leg{fill:#64748b;font:12px ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){
 .bg{fill:#0f172a}.lab{fill:#e2e8f0}.glab{fill:#94a3b8}
 .cell{fill:#1e293b;stroke:#334155}.xcell{fill:#60a5fa;stroke:#60a5fa}
 .ctext{fill:#94a3b8}.xtext{fill:#0b1220}.win{stroke:#e2e8f0}.anno{fill:#e2e8f0}
 .good{fill:#4ade80}.bad{fill:#f87171}.leg{fill:#94a3b8}}
</style>
<rect class="bg" x="0" y="0" width="880" height="356" rx="10"/>
<text class="lab" x="40" y="42">Array of Structs (AoS)  &#183;  Vec&lt;Boid&gt;</text>
<text class="glab" x="128" y="66" text-anchor="middle">boid 0</text>
<text class="glab" x="318" y="66" text-anchor="middle">boid 1</text>
<text class="glab" x="508" y="66" text-anchor="middle">boid 2</text>
<text class="glab" x="698" y="66" text-anchor="middle">boid 3</text>
<rect class="xcell" x="40" y="76" width="44" height="44" rx="4"/>
<text class="xtext" x="62" y="103" text-anchor="middle">x0</text>
<rect class="cell" x="84" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="106" y="103" text-anchor="middle">y0</text>
<rect class="cell" x="128" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="150" y="103" text-anchor="middle">vx0</text>
<rect class="cell" x="172" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="194" y="103" text-anchor="middle">vy0</text>
<rect class="xcell" x="230" y="76" width="44" height="44" rx="4"/>
<text class="xtext" x="252" y="103" text-anchor="middle">x1</text>
<rect class="cell" x="274" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="296" y="103" text-anchor="middle">y1</text>
<rect class="cell" x="318" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="340" y="103" text-anchor="middle">vx1</text>
<rect class="cell" x="362" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="384" y="103" text-anchor="middle">vy1</text>
<rect class="xcell" x="420" y="76" width="44" height="44" rx="4"/>
<text class="xtext" x="442" y="103" text-anchor="middle">x2</text>
<rect class="cell" x="464" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="486" y="103" text-anchor="middle">y2</text>
<rect class="cell" x="508" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="530" y="103" text-anchor="middle">vx2</text>
<rect class="cell" x="552" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="574" y="103" text-anchor="middle">vy2</text>
<rect class="xcell" x="610" y="76" width="44" height="44" rx="4"/>
<text class="xtext" x="632" y="103" text-anchor="middle">x3</text>
<rect class="cell" x="654" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="676" y="103" text-anchor="middle">y3</text>
<rect class="cell" x="698" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="720" y="103" text-anchor="middle">vx3</text>
<rect class="cell" x="742" y="76" width="44" height="44" rx="4"/>
<text class="ctext" x="764" y="103" text-anchor="middle">vy3</text>
<rect class="win" x="34" y="70" width="188" height="56" rx="7"/>
<text class="anno" x="40" y="152">One 4-wide load reads 4 adjacent slots. <tspan class="bad">1 of 4 is an x</tspan>, the x's sit 4 apart.</text>
<text class="lab" x="40" y="196">Structure of Arrays (SoA)  &#183;  parallel arrays</text>
<text class="glab" x="128" y="220" text-anchor="middle">all x</text>
<text class="glab" x="318" y="220" text-anchor="middle">all y</text>
<text class="glab" x="508" y="220" text-anchor="middle">all vx</text>
<text class="glab" x="698" y="220" text-anchor="middle">all vy</text>
<rect class="xcell" x="40" y="230" width="44" height="44" rx="4"/>
<text class="xtext" x="62" y="257" text-anchor="middle">x0</text>
<rect class="xcell" x="84" y="230" width="44" height="44" rx="4"/>
<text class="xtext" x="106" y="257" text-anchor="middle">x1</text>
<rect class="xcell" x="128" y="230" width="44" height="44" rx="4"/>
<text class="xtext" x="150" y="257" text-anchor="middle">x2</text>
<rect class="xcell" x="172" y="230" width="44" height="44" rx="4"/>
<text class="xtext" x="194" y="257" text-anchor="middle">x3</text>
<rect class="cell" x="230" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="252" y="257" text-anchor="middle">y0</text>
<rect class="cell" x="274" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="296" y="257" text-anchor="middle">y1</text>
<rect class="cell" x="318" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="340" y="257" text-anchor="middle">y2</text>
<rect class="cell" x="362" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="384" y="257" text-anchor="middle">y3</text>
<rect class="cell" x="420" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="442" y="257" text-anchor="middle">vx0</text>
<rect class="cell" x="464" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="486" y="257" text-anchor="middle">vx1</text>
<rect class="cell" x="508" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="530" y="257" text-anchor="middle">vx2</text>
<rect class="cell" x="552" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="574" y="257" text-anchor="middle">vx3</text>
<rect class="cell" x="610" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="632" y="257" text-anchor="middle">vy0</text>
<rect class="cell" x="654" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="676" y="257" text-anchor="middle">vy1</text>
<rect class="cell" x="698" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="720" y="257" text-anchor="middle">vy2</text>
<rect class="cell" x="742" y="230" width="44" height="44" rx="4"/>
<text class="ctext" x="764" y="257" text-anchor="middle">vy3</text>
<rect class="win" x="34" y="224" width="188" height="56" rx="7"/>
<text class="anno" x="40" y="306">One 4-wide load reads 4 adjacent slots. <tspan class="good">4 of 4 are x</tspan>, one instruction updates four boids.</text>
<rect class="xcell" x="40" y="326" width="18" height="18" rx="3"/><text class="leg" x="66" y="340">x component, the values a position pass processes together</text>
<rect class="win" x="474" y="326" width="30" height="18" rx="4"/><text class="leg" x="512" y="340">one SIMD load / cache line</text>
</svg>
