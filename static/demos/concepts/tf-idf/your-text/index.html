<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TF-IDF: compare your own text</title>
  <link rel="stylesheet" href="./demo.css">
</head>

<body>
  <div id="demo">
    <header id="head">
      <p id="objective">Paste or type into both boxes and watch the score. (A
        search query is just an extreme case: a document one line long.)</p>

      <div id="panes">
        <div class="pane">
          <label class="a" for="txtA">Text A</label>
          <textarea id="txtA" spellcheck="false" placeholder="Paste or type some text&hellip;"></textarea>
        </div>
        <div class="pane">
          <label class="b" for="txtB">Text B</label>
          <textarea id="txtB" spellcheck="false" placeholder="&hellip;and something to compare it against."></textarea>
        </div>
      </div>

      <div id="examples">
        <span class="exlabel">Feeling lazy? Load an example:</span>
        <span id="exbtns"></span>
      </div>
    </header>

    <section id="out">
      <p id="empty">Fill both boxes (or load an example) to compare them.</p>

      <div id="result" hidden>
        <div id="meter" aria-label="cosine similarity from 0 to 1">
          <div id="stack"></div>
          <span id="tick0">0</span>
          <span id="tick1">1</span>
        </div>
        <p id="scorenum"></p>

        <p id="bkhead">Every word both texts use adds
          <b>weight<sub>A</sub> &times; weight<sub>B</sub></b> to the score:
        </p>
        <ol id="contribs"></ol>
        <p id="sharednote"></p>
      </div>
    </section>

    <footer id="credit"></footer>
  </div>

  <script src="./demo.js"></script>
</body>

</html>
