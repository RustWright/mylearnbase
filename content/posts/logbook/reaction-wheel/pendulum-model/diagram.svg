<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t">
  <title id="t">Reaction-wheel pendulum: arm angle θ from vertical, wheel angle φ measured from the arm, motor torque u on the wheel and its reaction on the arm</title>
  <defs>
    <marker id="a-wheel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="a-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <!-- A light card, so the figure reads the same in the site's light and dark themes. -->
  <rect width="440" height="360" rx="14" fill="#f6f5f0"/>

  <!-- stand -->
  <path d="M200 300 L178 344 L222 344 Z" fill="#dcd8cc"/>

  <!-- vertical reference and the theta arc -->
  <line x1="200" y1="300" x2="200" y2="70" stroke="#687083" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M200 230 A70 70 0 0 1 223.9 234.2" fill="none" stroke="#0f8a57" stroke-width="2.5"/>
  <text x="208" y="214" font-size="20" font-style="italic" fill="#0f8a57">θ</text>

  <!-- arm, and its direction continued through the wheel: phi's zero -->
  <line x1="200" y1="300" x2="258.1" y2="140.2" stroke="#1c2230" stroke-width="10" stroke-linecap="round"/>
  <line x1="258.1" y1="140.2" x2="285.5" y2="65" stroke="#687083" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- wheel, with the marked spoke phi is read from -->
  <circle cx="258.1" cy="140.2" r="60" fill="none" stroke="#1f6fd1" stroke-width="6"/>
  <line x1="258.1" y1="140.2" x2="247.7" y2="199.3" stroke="#1f6fd1" stroke-width="2" opacity="0.35"/>
  <line x1="258.1" y1="140.2" x2="212.1" y2="101.6" stroke="#1f6fd1" stroke-width="2" opacity="0.35"/>
  <line x1="258.1" y1="140.2" x2="314.5" y2="119.7" stroke="#1f6fd1" stroke-width="3.5"/>
  <path d="M271.8 102.6 A40 40 0 0 1 295.7 126.5" fill="none" stroke="#b86e00" stroke-width="2.5"/>
  <text x="286" y="106" font-size="20" font-style="italic" fill="#b86e00">φ</text>

  <!-- motor torque on the wheel, and its reaction on the arm -->
  <path d="M186.7 166.2 A76 76 0 0 1 199.9 91.3" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#a-wheel)"/>
  <text x="36" y="132" font-size="16" fill="#c2410c"><tspan font-style="italic">u</tspan> on the wheel</text>
  <path d="M233.5 305.9 A34 34 0 0 0 221.9 274" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-arm)"/>
  <text x="244" y="296" font-size="16" fill="#7c3aed">−<tspan font-style="italic">u</tspan> on the arm</text>

  <!-- hub and pivot -->
  <circle cx="258.1" cy="140.2" r="8" fill="#1c2230"/>
  <circle cx="200" cy="300" r="7" fill="#ffffff" stroke="#1c2230" stroke-width="3"/>
  <text x="140" y="318" font-size="14" fill="#687083">pivot</text>
  <text x="332" y="186" font-size="14" fill="#687083">motor + wheel</text>
</svg>
